[project]
name = "bx-scholar-mcp"
version = "1.0.0"
description = "BX-Scholar MCP — Academic research toolkit monorepo"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Leonardo Camilo", email = "leo@baxi.ia.br"},
]

dependencies = [
    "bx-scholar-core",
    "bx-scholar-workflow",
]

[project.optional-dependencies]
marker = ["marker-pdf>=1.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/leomcamilo/bx-scholar-mcp"
Issues = "https://github.com/leomcamilo/bx-scholar-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
bx-scholar-core = { workspace = true }
bx-scholar-workflow = { workspace = true }
