# Alembic do store durável do BX-Scholar v2.
#
# A URL do banco NÃO fica aqui — é injetada em migrations/env.py a partir de
# BX_SCHOLAR_DATABASE_URL (mesmo padrão do BXat). É isso que permite rodar
# `alembic upgrade head` contra SQLite e contra Postgres sem editar arquivo.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
